[package]
name = "chatgpt-app-launcher"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
ason = "4.1.1"
serde = { version = "1.0", features = ["derive"] }
url = "2.5"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString", "NSURL"] }

[dev-dependencies]
tempfile = "3"
